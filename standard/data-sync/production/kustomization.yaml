apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: data-sync

# Base = Helm chart output. Generated by ./render.sh (do not commit: it
# contains the rendered Secret). See docs/OPTIONS_AND_TRADEOFFS.md.
resources:
  - rendered/data-sync.yaml

patches:
  # 1) Spread pods across GCP zones (hard) and nodes (soft)
  - target:
      kind: Deployment
      name: data-sync
    patch: |-
      - op: add
        path: /spec/template/spec/topologySpreadConstraints
        value:
          - maxSkew: 1
            topologyKey: topology.kubernetes.io/zone
            whenUnsatisfiable: DoNotSchedule
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: data-sync
                app.kubernetes.io/instance: data-sync
          - maxSkew: 1
            topologyKey: kubernetes.io/hostname
            whenUnsatisfiable: ScheduleAnyway
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: data-sync
                app.kubernetes.io/instance: data-sync

  # 2) SECRET_CHECKSUM pod-template annotation (value written by render.sh)
  - path: secret-checksum-patch.yaml
    target:
      kind: Deployment
      name: data-sync
