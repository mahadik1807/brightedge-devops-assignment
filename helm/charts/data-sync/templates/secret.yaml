{{- if not .Values.redis.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "data-sync.secretName" . }}
  labels:
    {{- include "data-sync.labels" . | nindent 4 }}
type: Opaque
stringData:
  REDIS_PASSWORD: {{ required "redis.password is required (or set redis.existingSecret)" .Values.redis.password | quote }}
{{- end }}
