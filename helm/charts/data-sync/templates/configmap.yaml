apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "data-sync.fullname" . }}
  labels:
    {{- include "data-sync.labels" . | nindent 4 }}
data:
  APP_ENV: {{ .Values.appEnv | quote }}
  REDIS_HOST: {{ .Values.redis.host | quote }}
  REDIS_PORT: {{ .Values.redis.port | quote }}
  LOG_LEVEL: {{ .Values.logLevel | quote }}
  WORKERS: {{ .Values.workers | quote }}
  MAX_CONNECTIONS: {{ .Values.maxConnections | quote }}
