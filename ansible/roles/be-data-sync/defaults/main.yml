---
# Application configuration (override in group_vars)
data_sync_app_env: staging
data_sync_redis_host: localhost
data_sync_redis_port: 6379
data_sync_log_level: INFO
data_sync_workers: 4
data_sync_max_connections: 100
data_sync_port: 8080
# Vault-encrypted in real use. Empty = no secrets file is written.
data_sync_redis_password: ""

# Source and layout
data_sync_repo_url: https://github.com/example/data-sync.git
data_sync_repo_version: main
data_sync_install_dir: /srv/data-sync
data_sync_venv_dir: /srv/data-sync/venv
data_sync_requirements_file: requirements.txt
data_sync_app_module: app.main:app

# Runtime identity and paths
data_sync_user: data-sync
data_sync_group: data-sync
data_sync_config_dir: /etc/data-sync
data_sync_service_name: data-sync

data_sync_packages:
  - python39
  - python39-pip
  - git
